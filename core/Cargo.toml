[package]
name = "lfsync-core"
version = "0.1.0"
edition = "2021"
description = "Core logic for network-local-file-manager: file watching, LAN peer discovery, and change-event protocol"

[dependencies]
notify = "6"
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
