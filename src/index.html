<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>network-local-file-manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>network-local-file-manager</h1>
      <p class="subtitle">監視中のフォルダに変更があると、このPCと同じネットワーク上の他のPCにトースト通知します。</p>

      <section>
        <div class="section-header">
          <h2>監視フォルダ</h2>
          <button id="add-folder-btn">フォルダを追加</button>
        </div>
        <ul id="folder-list" class="list"></ul>
        <p id="folder-empty" class="empty-hint" hidden>まだフォルダが登録されていません。</p>
      </section>

      <section>
        <h2>LAN上のPC (<span id="peer-count">0</span>)</h2>
        <ul id="peer-list" class="list"></ul>
        <p id="peer-empty" class="empty-hint">同じネットワーク上に他のPCが見つかりません。</p>
      </section>

      <section>
        <h2>共有キー</h2>
        <p class="subtitle">
          通知を送り合いたいPC同士で、同じ値を設定してください(Wi-Fiのパスワードのようなものです)。値が一致しない相手とは通知が届きません。変更後はアプリの再起動が必要です。
        </p>
        <div class="key-row">
          <input id="shared-secret-input" type="text" spellcheck="false" autocomplete="off" />
          <button id="save-secret-btn">保存</button>
        </div>
        <p id="secret-saved-hint" class="empty-hint" hidden>保存しました。反映には再起動が必要です。</p>
      </section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
