[package]
name = "network-local-file-manager"
version = "0.1.0"
description = "Watches folders and notifies you the instant a file changes anywhere on your LAN"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
lfsync-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"

[dev-dependencies]
tempfile = "3"
